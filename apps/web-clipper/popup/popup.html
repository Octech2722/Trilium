<!DOCTYPE html>

<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <link rel="stylesheet" href="popup.css"/>
  </head>

<body>
  <div class="header">
    <div class="header-content">
      <h2 class="title">Trilium Web Clipper</h2>
      <div class="header-actions">
        <button class="icon-button" id="theme-toggle-button" title="Toggle Dark/Light Mode">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="sun-icon">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="moon-icon" style="display: none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button class="icon-button" id="show-options-button" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"></path>
          </svg>
        </button>
        <button class="icon-button" id="show-help-button" title="Help">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Main View -->
  <div id="main-view" class="view">
    <div id="already-visited" class="already-visited"></div>

    <div class="actions-section">
      <button class="action-button primary needs-connection" id="save-whole-page-button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14,2 14,8 20,8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10,9 9,9 8,9"></polyline>
        </svg>
        <span>Save Page</span>
      </button>

      <button class="action-button needs-connection" id="save-cropped-screenshot-button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span>Crop Screenshot</span>
      </button>

      <button class="action-button needs-connection" id="save-whole-screenshot-button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21,15 16,10 5,21"></polyline>
        </svg>
        <span>Full Screenshot</span>
      </button>

      <button class="action-button needs-connection" id="save-link-with-note-button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>Save Link with Note</span>
      </button>

      <button class="action-button needs-connection" id="save-tabs-button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Save All Tabs</span>
      </button>
    </div>

    <div class="status-section">
      <div class="status-container">
        <div class="status-info">
          <span class="status-label">Status:</span>
          <span id="connection-status" class="status-value">unknown</span>
        </div>
        <button class="status-button" id="check-connection-button" title="Check Connection">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23,4 23,10 17,10"></polyline>
            <polyline points="1,20 1,14 7,14"></polyline>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Settings View -->
  <div id="settings-view" class="view" style="display: none;">
    <div class="settings-content">
      <div class="settings-header">
        <button class="back-button" id="back-to-main">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span>Back</span>
        </button>
        <h2>Settings</h2>
      </div>

      <div class="settings-sections">
        <!-- Video Processing Settings -->
        <div class="settings-section">
          <h3>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            Video Processing
          </h3>
          
          <form id="video-settings-form" class="settings-form">
            <div class="form-group">
              <label class="form-label">Processing Mode</label>
              <div class="radio-group">
                <label class="radio-option">
                  <input type="radio" name="video-mode" value="HYBRID" checked>
                  <span class="radio-dot"></span>
                  <div class="radio-text">
                    <strong>Hybrid Mode</strong>
                    <small>Embed with fallback links</small>
                  </div>
                </label>
                <label class="radio-option">
                  <input type="radio" name="video-mode" value="LINKS_ONLY">
                  <span class="radio-dot"></span>
                  <div class="radio-text">
                    <strong>Links Only</strong>
                    <small>Convert to text links</small>
                  </div>
                </label>
              </div>
            </div>
            
            <div class="form-group">
              <label class="checkbox-option">
                <input type="checkbox" id="privacy-mode" checked>
                <span class="checkbox-mark"></span>
                <div class="checkbox-text">
                  <strong>Privacy Mode</strong>
                  <small>Use privacy-enhanced URLs</small>
                </div>
              </label>
            </div>
            
            <button type="submit" class="save-button">Save Video Settings</button>
          </form>
        </div>

        <!-- Debug Settings -->
        <div class="settings-section">
          <h3>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            Debug Settings
          </h3>
          
          <form id="debug-settings-form" class="settings-form">
            <div class="form-group">
              <label class="checkbox-option">
                <input type="checkbox" id="debug-enabled">
                <span class="checkbox-mark"></span>
                <div class="checkbox-text">
                  <strong>Enable Debug Logging</strong>
                  <small>Show detailed logs in console</small>
                </div>
              </label>
            </div>
            
            <button type="submit" class="save-button">Save Debug Settings</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Note Wrapper (shown when adding notes) -->
  <div id="save-link-with-note-wrapper" class="note-wrapper">
    <div class="note-input-container">
      <textarea id="save-link-with-note-textarea" placeholder="Add your note here..."></textarea>
    </div>
    
    <div class="note-options">
      <label class="checkbox-label">
        <input type="checkbox" id="keep-title-checkbox" name="keep-title-checkbox">
        <span class="checkmark"></span>
        Keep page title as note title
      </label>
    </div>
    
    <div class="note-actions">
      <button type="button" class="action-button primary" id="save-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20,6 9,17 4,12"></polyline>
        </svg>
        <span>Save</span>
      </button>
      <button type="button" class="action-button secondary" id="cancel-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span>Cancel</span>
      </button>
    </div>
  </div>

  <script src="../lib/browser-polyfill.js"></script>
  <script src="../lib/cash.min.js"></script>
  <script src="popup.js"></script>
  <script src="../utils.js"></script>
  <script src="../content.js"></script>
</body>

</html>
